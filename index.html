<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cresole 80 - Presenze</title>
  <!-- CONFIGURAZIONE PWA E ICONE HOMESCREEN -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cresole 80">
  <meta name="theme-color" content="#3730a3">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased pb-28">

  <!-- HEADER ELEGANTE E COMPATTO -->
  <header class="sticky top-0 z-30 bg-indigo-800/95 backdrop-blur-md text-white shadow-sm border-b border-indigo-900 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-sm font-extrabold tracking-tight">Cresole 80</span>
          <span class="bg-indigo-600 text-[10px] font-bold px-1.5 py-0.5 rounded text-indigo-100">Presenze</span>
        </div>
        <p id="subHeader" class="text-[11px] text-indigo-200 mt-0.5">Caricamento...</p>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="openPlayerModal()" class="bg-indigo-700/80 active:bg-indigo-600 text-white text-[11px] font-bold py-1.5 px-2.5 rounded-lg border border-indigo-500/40 shadow-sm transition">
          ➕ Atleta
        </button>
        <button onclick="openAddEventModal()" class="bg-indigo-600 active:bg-indigo-500 text-white text-[11px] font-bold py-1.5 px-2.5 rounded-lg border border-indigo-400/40 shadow-sm transition">
          ➕ Data
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-3.5 space-y-3">

    <!-- SELEZIONE CATEGORIA E DATA -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200/80 space-y-2.5">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Squadra</label>
          <select id="teamSelect" onchange="onTeamChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="Presenze_Esordienti2">Esordienti 2° Anno</option>
            <option value="Presenze_Pulcini2">Pulcini 2° Anno</option>
            <option value="Presenze_Pulcini1">Pulcini 1° Anno</option>
            <option value="Presenze_Primi_Calci">Primi Calci</option>
            <option value="Presenze_Piccoli_Amici2">Piccoli Amici 2° Anno</option>
            <option value="Presenze_Piccoli_Amici1">Piccoli Amici 1° Anno</option>
            <option value="Presenze_Allenatori">Allenatori</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Seduta</label>
          <select id="eventSelect" onchange="onEventChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Caricamento...</option>
          </select>
        </div>
      </div>

      <!-- OPZIONE METEO PIOGGIA -->
      <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="text-base">🌧️</span>
          <label for="checkRain" class="text-xs font-bold text-slate-700 select-none cursor-pointer">Meteo Pioggia</label>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="checkRain" onchange="toggleRain()" class="sr-only peer">
          <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-slate-600"></div>
        </label>
      </div>
    </div>

    <!-- STATISTICHE RAPIDE CONTAGIRI -->
    <div class="grid grid-cols-4 gap-1.5 text-center text-xs font-bold">
      <div class="bg-emerald-50 text-emerald-800 py-1.5 px-1 rounded-xl border border-emerald-200/80">
        P: <span id="countPresenti" class="text-emerald-900 font-extrabold">0</span>
      </div>
      <div class="bg-rose-50 text-rose-800 py-1.5 px-1 rounded-xl border border-rose-200/80">
        A: <span id="countAssenti" class="text-rose-900 font-extrabold">0</span>
      </div>
      <div class="bg-amber-50 text-amber-800 py-1.5 px-1 rounded-xl border border-amber-200/80">
        G: <span id="countGiustificati" class="text-amber-900 font-extrabold">0</span>
      </div>
      <div class="bg-purple-50 text-purple-800 py-1.5 px-1 rounded-xl border border-purple-200/80">
        I: <span id="countInfortunati" class="text-purple-900 font-extrabold">0</span>
      </div>
    </div>

    <!-- LISTA DEI RAGAZZI -->
    <div id="playerList" class="space-y-1.5">
      <!-- Generato dinamicamente via JS -->
    </div>
  </main>

  <!-- BARRA DI SALVATAGGIO IN BASSO FISSA -->
  <div class="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur-md border-t border-slate-200 z-20 shadow-lg">
    <div class="max-w-md mx-auto">
      <button onclick="saveAttendance()" id="btnSave" class="w-full bg-indigo-700 active:bg-indigo-800 text-white font-extrabold py-3.5 rounded-2xl shadow flex items-center justify-center gap-2 text-xs tracking-wide transition">
        <span>💾 SALVA PRESENZE</span>
      </button>
    </div>
  </div>

  <!-- MODAL: AGGIUNGI GIOCATORE -->
  <div id="modalPlayer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-800">Nuovo Atleta</h3>
        <button onclick="closePlayerModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Cognome e Nome</label>
        <input type="text" id="newPlayerName" placeholder="es. Rossi Marco" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closePlayerModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-xs font-bold">Annulla</button>
        <button onclick="confirmAddPlayer()" id="btnConfirmPlayer" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-bold shadow">Aggiungi</button>
      </div>
    </div>
  </div>

  <!-- MODAL: AGGIUNGI EVENTO -->
  <div id="modalEvent" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-800">Aggiungi Data / Seduta</h3>
        <button onclick="closeAddEventModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Data</label>
          <input type="date" id="newEventDate" class="w-full border border-slate-300 rounded-xl p-2 text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tipo Evento</label>
          <select id="newEventType" class="w-full border border-slate-300 rounded-xl p-2 text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Allenamento">Allenamento</option>
            <option value="Amichevole">Amichevole</option>
            <option value="Campionato">Partita Campionato</option>
            <option value="Torneo">Torneo</option>
            <option value="Ritiro">Ritiro</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeAddEventModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-xs font-bold">Annulla</button>
        <button onclick="confirmAddEvent()" id="btnConfirmEvent" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-bold shadow">Aggiungi</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw6lVaMmUsEj4ruFW_Y4otStD_erh4mPRMMkpXUFy0CKa9BsfJ1giBedJb0yl0Hy4yBEg/exec";

    let currentTeam = "Presenze_Esordienti2";
    let appData = { players: [], events: [], attendanceMap: {} };
    let currentAttendance = {};
    let isRainActive = false;

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const teamQuery = urlParams.get('team');
      if (teamQuery) {
        const fullTeamName = teamQuery.startsWith("Presenze_") ? teamQuery : "Presenze_" + teamQuery;
        const select = document.getElementById('teamSelect');
        for (let i = 0; i < select.options.length; i++) {
          if (select.options[i].value.toLowerCase() === fullTeamName.toLowerCase()) {
            select.selectedIndex = i;
            currentTeam = select.options[i].value;
            break;
          }
        }
      } else {
        currentTeam = document.getElementById('teamSelect').value;
      }

      await loadTeamData();
    }

    async function loadTeamData() {
      document.getElementById('subHeader').innerText = "Sincronizzazione...";
      document.getElementById('playerList').innerHTML = `<div class="text-center py-8 text-xs text-slate-400">Caricamento rosa...</div>`;

      try {
        const res = await fetch(`${API_URL}?team=${encodeURIComponent(currentTeam)}`);
        const data = await res.json();

        if (data.status === "success") {
          appData = data;
          if (!appData.attendanceMap) appData.attendanceMap = {};
          document.getElementById('subHeader').innerText = `${appData.players.length} Atleti in rosa`;
          populateEvents();
        } else {
          alert("Errore: " + data.message);
        }
      } catch (err) {
        alert("Errore durante il recupero dei dati dal foglio.");
      }
    }

    function onTeamChange() {
      currentTeam = document.getElementById('teamSelect').value;
      loadTeamData();
    }

    function populateEvents() {
      const select = document.getElementById('eventSelect');
      select.innerHTML = "";

      if (!appData.events || appData.events.length === 0) {
        select.innerHTML = `<option value="">Nessun evento presente</option>`;
        document.getElementById('playerList').innerHTML = "";
        return;
      }

      appData.events.forEach(ev => {
        const opt = document.createElement('option');
        opt.value = String(ev.col);
        const rainIcon = ev.isRain ? "🌧️ " : "";
        opt.innerText = `${rainIcon}${ev.date} - ${ev.type}`;
        select.appendChild(opt);
      });

      select.selectedIndex = appData.events.length - 1;
      onEventChange();
    }

    function onEventChange() {
      const select = document.getElementById('eventSelect');
      const selectedCol = String(select.value);
      currentAttendance = {};

      if (!selectedCol) return;

      // Meteo pioggia per questa seduta
      const currentEv = appData.events.find(ev => String(ev.col) === selectedCol);
      isRainActive = currentEv ? Boolean(currentEv.isRain) : false;
      document.getElementById('checkRain').checked = isRainActive;

      // Presenze archiviate
      const savedForDate = (appData.attendanceMap && (appData.attendanceMap[selectedCol] || appData.attendanceMap[parseInt(selectedCol)]))
        ? (appData.attendanceMap[selectedCol] || appData.attendanceMap[parseInt(selectedCol)])
        : {};

      appData.players.forEach(p => {
        const previousValue = savedForDate[p.row] || savedForDate[String(p.row)];
        if (previousValue && ["Presente", "Assente", "Giustificato", "Infortunato"].includes(previousValue)) {
          currentAttendance[p.row] = previousValue;
        } else {
          currentAttendance[p.row] = "Presente";
        }
      });

      renderPlayers();
      updateCounters();
    }

    function toggleRain() {
      isRainActive = document.getElementById('checkRain').checked;
      const select = document.getElementById('eventSelect');
      const selectedCol = String(select.value);
      const ev = appData.events.find(e => String(e.col) === selectedCol);
      if (ev) {
        ev.isRain = isRainActive;
        const opt = select.options[select.selectedIndex];
        if (opt) {
          const rainIcon = isRainActive ? "🌧️ " : "";
          opt.innerText = `${rainIcon}${ev.date} - ${ev.type}`;
        }
      }
    }

    function renderPlayers() {
      const list = document.getElementById('playerList');
      list.innerHTML = "";

      if (appData.players.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Nessun giocatore registrato. Clicca '+ Atleta' per aggiungerne uno.</div>`;
        return;
      }

      appData.players.forEach(p => {
        const status = currentAttendance[p.row] || "Presente";
        const div = document.createElement('div');
        div.className = "bg-white px-3 py-2.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-between";
        
        div.innerHTML = `
          <div class="font-bold text-slate-800 text-xs tracking-tight truncate mr-2">${p.name}</div>
          <div class="flex gap-1">
            <button onclick="setStatus(${p.row}, 'Presente')" class="w-8 h-8 rounded-xl text-xs font-black transition flex items-center justify-center ${status === 'Presente' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-500 active:bg-slate-200'}">P</button>
            <button onclick="setStatus(${p.row}, 'Assente')" class="w-8 h-8 rounded-xl text-xs font-black transition flex items-center justify-center ${status === 'Assente' ? 'bg-rose-600 text-white shadow' : 'bg-slate-100 text-slate-500 active:bg-slate-200'}">A</button>
            <button onclick="setStatus(${p.row}, 'Giustificato')" class="w-8 h-8 rounded-xl text-xs font-black transition flex items-center justify-center ${status === 'Giustificato' ? 'bg-amber-500 text-white shadow' : 'bg-slate-100 text-slate-500 active:bg-slate-200'}">G</button>
            <button onclick="setStatus(${p.row}, 'Infortunato')" class="w-8 h-8 rounded-xl text-xs font-black transition flex items-center justify-center ${status === 'Infortunato' ? 'bg-purple-600 text-white shadow' : 'bg-slate-100 text-slate-500 active:bg-slate-200'}">I</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function setStatus(row, status) {
      currentAttendance[row] = status;
      renderPlayers();
      updateCounters();
    }

    function updateCounters() {
      let p = 0, a = 0, g = 0, i = 0;
      Object.values(currentAttendance).forEach(st => {
        if (st === "Presente") p++;
        else if (st === "Assente") a++;
        else if (st === "Giustificato") g++;
        else if (st === "Infortunato") i++;
      });
      document.getElementById('countPresenti').innerText = p;
      document.getElementById('countAssenti').innerText = a;
      document.getElementById('countGiustificati').innerText = g;
      document.getElementById('countInfortunati').innerText = i;
    }

    async function saveAttendance() {
      const selectedCol = document.getElementById('eventSelect').value;
      if (!selectedCol) return alert("Seleziona o crea prima una seduta!");

      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "Salvataggio in corso...";

      const records = Object.keys(currentAttendance).map(row => ({
        row: parseInt(row),
        status: currentAttendance[row]
      }));

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "saveAttendance",
            team: currentTeam,
            col: selectedCol,
            isRain: isRainActive,
            records: records
          })
        });
        const resData = await res.json();
        if (resData.status === "success") {
          const colKey = String(selectedCol);
          if (!appData.attendanceMap) appData.attendanceMap = {};
          if (!appData.attendanceMap[colKey]) appData.attendanceMap[colKey] = {};
          records.forEach(r => {
            appData.attendanceMap[colKey][r.row] = r.status;
          });
          alert("✅ Presenze e meteo aggiornati con successo!");
        } else {
          alert("Errore: " + resData.message);
        }
      } catch (err) {
        alert("Errore durante il salvataggio.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>💾 SALVA PRESENZE</span>";
      }
    }

    // GESTIONE NUOVO GIOCATORE
    function openPlayerModal() {
      document.getElementById('newPlayerName').value = "";
      document.getElementById('modalPlayer').classList.remove('hidden');
    }
    function closePlayerModal() {
      document.getElementById('modalPlayer').classList.add('hidden');
    }
    async function confirmAddPlayer() {
      const name = document.getElementById('newPlayerName').value.trim();
      if (!name) return alert("Inserisci il cognome e nome dell'atleta");

      const btn = document.getElementById('btnConfirmPlayer');
      btn.disabled = true;
      btn.innerText = "Inserimento...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "addPlayer", team: currentTeam, name: name })
        });
        const resData = await res.json();
        if (resData.status === "success") {
          alert(`✅ ${name} aggiunto con successo alla squadra!`);
          closePlayerModal();
          await loadTeamData();
        } else {
          alert("Errore: " + resData.message);
        }
      } catch (err) {
        alert("Errore di rete nell'aggiunta del giocatore.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Aggiungi";
      }
    }

    // GESTIONE NUOVA DATA
    function openAddEventModal() {
      document.getElementById('newEventDate').valueAsDate = new Date();
      document.getElementById('modalEvent').classList.remove('hidden');
    }
    function closeAddEventModal() {
      document.getElementById('modalEvent').classList.add('hidden');
    }
    async function confirmAddEvent() {
      const dateVal = document.getElementById('newEventDate').value;
      const typeVal = document.getElementById('newEventType').value;
      if (!dateVal) return alert("Inserisci una data valida");

      const btn = document.getElementById('btnConfirmEvent');
      btn.disabled = true;
      btn.innerText = "Salvataggio...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "addEvent",
            team: currentTeam,
            date: dateVal,
            type: typeVal
          })
        });
        const resData = await res.json();
        if (resData.status === "success") {
          alert("✅ Nuova data inserita in ordine cronologico!");
          closeAddEventModal();
          await loadTeamData();
        } else {
          alert("Errore: " + resData.message);
        }
      } catch (err) {
        alert("Errore di rete nell'aggiunta dell'evento.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Aggiungi";
      }
    }

    window.onload = init;
  </script>
</body>
</html>
