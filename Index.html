<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cresole 80 - Presenze</title>
  <meta name="theme-color" content="#4338ca">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-32">

  <!-- HEADER FISSO -->
  <header class="sticky top-0 z-30 bg-indigo-700 text-white shadow-md p-4 flex justify-between items-center">
    <div>
      <h1 class="text-base font-bold tracking-tight">S.S. Cresole 80</h1>
      <p id="subHeader" class="text-xs text-indigo-200">Caricamento in corso...</p>
    </div>
    <button onclick="openAddEventModal()" class="bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition flex items-center gap-1">
      <span>➕ Data</span>
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-3">

    <!-- SELETTORE SQUADRA E DATA -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Squadra / Categoria</label>
        <select id="teamSelect" onchange="onTeamChange()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="Presenze_Esordienti2">Esordienti 2° Anno</option>
          <option value="Presenze_Pulcini2">Pulcini 2° Anno</option>
          <option value="Presenze_Pulcini1">Pulcini 1° Anno</option>
          <option value="Presenze_Primi_Calci">Primi Calci</option>
          <option value="Presenze_Piccoli_Amici2">Piccoli Amici 2° Anno</option>
          <option value="Presenze_Piccoli_Amici1">Piccoli Amici 1° Anno</option>
          <option value="Presenze_Allenatori">Staff / Allenatori</option>
        </select>
      </div>

      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Seduta / Partita</label>
        <select id="eventSelect" onchange="onEventChange()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Caricamento date...</option>
        </select>
      </div>
    </div>

    <!-- RIEPILOGO RAPIDO -->
    <div class="grid grid-cols-2 gap-2 text-center text-xs font-semibold">
      <div class="bg-emerald-50 text-emerald-800 p-2 rounded-xl border border-emerald-200">
        Presenti: <span id="countPresenti" class="text-sm font-bold ml-1">0</span>
      </div>
      <div class="bg-rose-50 text-rose-800 p-2 rounded-xl border border-rose-200">
        Assenti: <span id="countAssenti" class="text-sm font-bold ml-1">0</span>
      </div>
    </div>

    <!-- LISTA RAGAZZI -->
    <div id="playerList" class="space-y-2">
      <!-- Generato da JS -->
    </div>
  </main>

  <!-- FOOTER FISSO SALVATAGGIO -->
  <div class="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-slate-200 z-20">
    <div class="max-w-md mx-auto flex gap-2">
      <button onclick="markAllPresent()" class="w-1/3 bg-slate-200 active:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl text-xs transition">
        Tutti P
      </button>
      <button onclick="saveAttendance()" id="btnSave" class="w-2/3 bg-indigo-600 active:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-1.5 text-xs transition">
        <span>💾 Salva Presenze</span>
      </button>
    </div>
  </div>

  <!-- MODAL INSERIMENTO DATA EXTRA -->
  <div id="modalEvent" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <h3 class="text-sm font-bold text-slate-800">Aggiungi Data / Evento</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Data</label>
          <input type="date" id="newEventDate" class="w-full border border-slate-300 rounded-xl p-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tipo Evento</label>
          <select id="newEventType" class="w-full border border-slate-300 rounded-xl p-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none font-medium">
            <option value="Allenamento">Allenamento</option>
            <option value="Amichevole">Amichevole</option>
            <option value="Campionato">Partita di Campionato</option>
            <option value="Torneo">Torneo</option>
            <option value="Ritiro">Ritiro</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeAddEventModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 rounded-xl text-xs font-semibold">Annulla</button>
        <button onclick="confirmAddEvent()" id="btnConfirmEvent" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-bold shadow">Aggiungi</button>
      </div>
    </div>
  </div>

  <script>
    // INCOLLA QUI IL TUO URL DI DISTRIBUZIONE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbw8zmdznfwkAiZuQNsIVsUl7SAOQWsfRRs0FcEpMJEd/dev";

    let currentTeam = "Presenze_Esordienti2";
    let appData = { players: [], events: [] };
    let currentAttendance = {};

    async function init() {
      // Controlla se c'è un parametro team nell'URL (es: ?team=Pulcini1)
      const urlParams = new URLSearchParams(window.location.search);
      const teamQuery = urlParams.get('team');
      if (teamQuery) {
        const fullTeamName = teamQuery.startsWith("Presenze_") ? teamQuery : "Presenze_" + teamQuery;
        const select = document.getElementById('teamSelect');
        for (let i = 0; i < select.options.length; i++) {
          if (select.options[i].value.toLowerCase() === fullTeamName.toLowerCase()) {
            select.selectedIndex = i;
            currentTeam = select.options[i].value;
            break;
          }
        }
      } else {
        currentTeam = document.getElementById('teamSelect').value;
      }

      await loadTeamData();
    }

    async function loadTeamData() {
      document.getElementById('subHeader').innerText = "Caricamento squadra...";
      document.getElementById('playerList').innerHTML = `<div class="text-center py-8 text-xs text-slate-400">Caricamento elenco...</div>`;

      try {
        const res = await fetch(`${API_URL}?team=${encodeURIComponent(currentTeam)}`);
        const data = await res.json();

        if (data.status === "success") {
          appData = data;
          document.getElementById('subHeader').innerText = `${appData.players.length} Atleti in elenco`;
          populateEvents();
        } else {
          alert("Errore: " + data.message);
        }
      } catch (err) {
        alert("Impossibile connettersi al Google Sheet.");
      }
    }

    function onTeamChange() {
      currentTeam = document.getElementById('teamSelect').value;
      loadTeamData();
    }

    function populateEvents() {
      const select = document.getElementById('eventSelect');
      select.innerHTML = "";

      if (appData.events.length === 0) {
        select.innerHTML = `<option value="">Nessun evento presente (clicca '➕ Data')</option>`;
        document.getElementById('playerList').innerHTML = "";
        return;
      }

      appData.events.forEach(ev => {
        const opt = document.createElement('option');
        opt.value = ev.col;
        opt.innerText = `${ev.date} - ${ev.type}`;
        select.appendChild(opt);
      });

      // Seleziona l'ultimo evento registrato
      select.selectedIndex = appData.events.length - 1;
      onEventChange();
    }

    function onEventChange() {
      currentAttendance = {};
      appData.players.forEach(p => {
        currentAttendance[p.row] = "Presente";
      });
      renderPlayers();
      updateCounters();
    }

    function renderPlayers() {
      const list = document.getElementById('playerList');
      list.innerHTML = "";

      if (appData.players.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Nessun giocatore trovato in questa scheda.</div>`;
        return;
      }

      appData.players.forEach(p => {
        const status = currentAttendance[p.row] || "Presente";
        const div = document.createElement('div');
        div.className = "bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between";
        
        div.innerHTML = `
          <div class="font-medium text-slate-800 text-xs truncate mr-2">${p.name}</div>
          <div class="flex gap-1">
            <button onclick="setStatus(${p.row}, 'Presente')" class="w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center ${status === 'Presente' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-600'}">P</button>
            <button onclick="setStatus(${p.row}, 'Assente')" class="w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center ${status === 'Assente' ? 'bg-rose-600 text-white shadow' : 'bg-slate-100 text-slate-600'}">A</button>
            <button onclick="setStatus(${p.row}, 'Giustificato')" class="w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center ${status === 'Giustificato' ? 'bg-amber-500 text-white shadow' : 'bg-slate-100 text-slate-600'}">G</button>
            <button onclick="setStatus(${p.row}, 'Infortunato')" class="w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center ${status === 'Infortunato' ? 'bg-purple-600 text-white shadow' : 'bg-slate-100 text-slate-600'}">I</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function setStatus(row, status) {
      currentAttendance[row] = status;
      renderPlayers();
      updateCounters();
    }

    function markAllPresent() {
      appData.players.forEach(p => currentAttendance[p.row] = "Presente");
      renderPlayers();
      updateCounters();
    }

    function updateCounters() {
      let pCount = 0, aCount = 0;
      Object.values(currentAttendance).forEach(st => {
        if (st === "Presente") pCount++;
        else if (st === "Assente") aCount++;
      });
      document.getElementById('countPresenti').innerText = pCount;
      document.getElementById('countAssenti').innerText = aCount;
    }

    async function saveAttendance() {
      const selectedCol = document.getElementById('eventSelect').value;
      if (!selectedCol) return alert("Seleziona o crea prima una seduta!");

      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "Salvataggio...";

      const records = Object.keys(currentAttendance).map(row => ({
        row: parseInt(row),
        status: currentAttendance[row]
      }));

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "saveAttendance",
            team: currentTeam,
            col: selectedCol,
            records: records
          })
        });
        const resData = await res.json();
        if (resData.status === "success") {
          alert("✅ Presenze salvate correttamente!");
        } else {
          alert("Errore: " + resData.message);
        }
      } catch (err) {
        alert("Errore di rete durante il salvataggio.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>💾 Salva Presenze</span>";
      }
    }

    function openAddEventModal() {
      document.getElementById('newEventDate').valueAsDate = new Date();
      document.getElementById('modalEvent').classList.remove('hidden');
    }

    function closeAddEventModal() {
      document.getElementById('modalEvent').classList.add('hidden');
    }

    async function confirmAddEvent() {
      const dateVal = document.getElementById('newEventDate').value;
      const typeVal = document.getElementById('newEventType').value;
      if (!dateVal) return alert("Inserisci una data valida");

      const btn = document.getElementById('btnConfirmEvent');
      btn.disabled = true;
      btn.innerText = "Salvataggio...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "addEvent",
            team: currentTeam,
            date: dateVal,
            type: typeVal
          })
        });
        const resData = await res.json();
        if (resData.status === "success") {
          alert(`✅ Nuova data inserita in ordine cronologico!`);
          closeAddEventModal();
          await loadTeamData();
        } else {
          alert("Errore: " + resData.message);
        }
      } catch (err) {
        alert("Errore durante l'inserimento della data.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Aggiungi";
      }
    }

    window.onload = init;
  </script>
</body>
</html>
